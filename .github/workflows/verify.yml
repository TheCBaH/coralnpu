name: verify
on:
  push:
    branches: ["verify/**"]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker system prune -af --volumes || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - id: id
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/coralnpu.dockerfile
          push: false
          load: true
          tags: coralnpu:latest
          build-args: |
            _UID=${{ steps.id.outputs.uid }}
            _GID=${{ steps.id.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Linters
        run: |
          git fetch origin main
          docker run --rm --init --ipc=host -e BASE_BRANCH=origin/main \
            -v $PWD:$PWD -w $PWD -v $HOME:/home/builder coralnpu:latest \
            utils/run_linters.sh
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --init --ipc=host \
            -v $PWD:$PWD -w $PWD -v $HOME:/home/builder coralnpu:latest \
            bash -c "bazel test --verbose_failures --test_output=all --test_summary=detailed $(cat verify-targets.txt)"
